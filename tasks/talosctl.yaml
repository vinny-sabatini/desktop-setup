---
- name: Ensure GitHub3 Python Module
  ansible.builtin.pip:
    name: github3.py
- name: Get latest release of talos
  community.general.github_release:
    user: siderolabs
    repo: talos
    action: latest_release
  register: talos_latest_release
- ansible.builtin.set_fact:
    talosctl_url: https://github.com/siderolabs/talos/releases/download/{{ talos_latest_release.tag }}/talosctl-linux-{{ arm_or_amd }}
- name: Download talosctl
  ansible.builtin.get_url:
    url: "{{ talosctl_url }}"
    dest: "{{ tech_bin_dir }}/talosctl"
    mode: '0755'
