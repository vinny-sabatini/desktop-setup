---
- name: Check if Cilium is installed
  ansible.builtin.stat:
    path: "{{ tech_bin_dir }}/cilium"
  register: cilium_bin
- name: "Install Cilium"
  when: skip_installed == "n" or (not cilium_bin.stat.exists and skip_installed == "y")
  block:
    - name: Get latest release of cilium
      community.general.github_release:
        user: cilium
        repo: cilium-cli
        action: latest_release
      register: cilium_latest_release
    - ansible.builtin.set_fact:
        cilium_url: https://github.com/cilium/cilium-cli/releases/download/{{ cilium_latest_release.tag }}/cilium-{{ operating_system }}-{{ arm_or_amd }}.tar.gz
    - name: Download cilium
      ansible.builtin.unarchive:
        src: "{{ cilium_url }}"
        dest: "{{ tech_bin_dir }}"
        remote_src: true
        include:
          - cilium
