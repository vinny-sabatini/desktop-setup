---
- name: "Setup udev rules"
  when: ansible_facts['os_family'] == 'RedHat'
  block:
    - name: Add udev rules
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/
        src: files/udev/
        owner: root
        group: root
        mode: '0644'
      become: true

    - name: Reload udev rules
      ansible.builtin.command: sudo udevadm control --reload
      become: true

    - name: Trigger udev rules
      ansible.builtin.command: sudo udevadm trigger
      become: true